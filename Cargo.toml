[package]
name = "ppt-toy-ledger"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Streaming payments engine: applies a CSV of transactions to client accounts"
publish = false

[dependencies]
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
